name: Wayback Machine

on:
  schedule:
    # 09:00 and 21:00 UTC = 06:00 and 18:00 in Brasília (UTC-3)
    - cron: '0 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    name: Save 9bot.com.br
    runs-on: ubuntu-latest
    steps:
      - name: Save /pt
        uses: JamieMagee/wayback@v2
        with:
          url: https://9bot.com.br/pt
          saveErrors: false
          saveOutlinks: false
          saveScreenshot: true

      - name: Wait 90 seconds
        if: always()
        run: sleep 90

      - name: Save /en
        if: always()
        uses: JamieMagee/wayback@v2
        with:
          url: https://9bot.com.br/en
          saveErrors: false
          saveOutlinks: false
          saveScreenshot: true

      - name: Wait 90 seconds
        if: always()
        run: sleep 90

      - name: Save /es
        if: always()
        uses: JamieMagee/wayback@v2
        with:
          url: https://9bot.com.br/es
          saveErrors: false
          saveOutlinks: false
          saveScreenshot: true

      - name: Wait 90 seconds
        if: always()
        run: sleep 90

      - name: Save /zh
        if: always()
        uses: JamieMagee/wayback@v2
        with:
          url: https://9bot.com.br/zh
          saveErrors: false
          saveOutlinks: false
          saveScreenshot: true
